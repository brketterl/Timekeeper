# One service and one persistent disk: SQLite must not be scaled to multiple instances.
services:
  - type: web
    name: timekeeper
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/timekeeper
    disk:
      name: timekeeper-data
      mountPath: /var/data
      sizeGB: 1
