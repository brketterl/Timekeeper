const dateObj=d=>new Date(d+'T12:00:00');
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const addDays=(d,n)=>{const x=dateObj(d);x.setDate(x.getDate()+n);return iso(x)};
const dayDiff=(a,b)=>Math.round((Date.UTC(...a.split('-').map((n,i)=>i===1?+n-1:+n))-Date.UTC(...b.split('-').map((n,i)=>i===1?+n-1:+n)))/86400000);
const periodFor=d=>d.slice(0,8)+(Number(d.slice(8))<=15?'01':'16');
const periodEnd=d=>{const p=periodFor(d);return p.endsWith('01')?p.slice(0,8)+'15':iso(new Date(dateObj(p).getFullYear(),dateObj(p).getMonth()+1,0,12))};
const shiftPeriod=(d,n)=>{let p=periodFor(d);while(n>0){p=addDays(periodEnd(p),1);n--}while(n<0){p=periodFor(addDays(p,-1));n++}return p};
const periodDays=d=>Array.from({length:dayDiff(periodEnd(d),periodFor(d))+1},(_,i)=>addDays(periodFor(d),i));
const pageDays=(d,page)=>periodDays(d).slice(page*8,page*8+8);

const fmtDate=(d,year=false)=>dateObj(d).toLocaleDateString('en-US',{month:'short',day:'numeric',...(year?{year:'numeric'}:{})});

function refreshSheet(s){s.status=!s.rows.length||s.rows.some(r=>r.status==='draft')?'draft':s.rows.some(r=>r.status==='submitted')?'submitted':'approved';return s}
function upgradeWorkspace(x){
 if(!validBackup(x))throw Error('Invalid workspace');
 if(x.version===2)return x;
 const result=JSON.parse(JSON.stringify(x)),grouped=new Map(),sources=new Map();
 for(const old of result.sheets){
  const getSheet=start=>{const key=old.employeeId+'|'+start;if(!grouped.has(key))grouped.set(key,{id:uid(),employeeId:old.employeeId,start,status:'draft',rows:[]});return grouped.get(key)};
  if(!old.rows.length)getSheet(periodFor(old.start));
  for(const row of old.rows){
   const chunks=new Map();for(const [date,h] of Object.entries(row.hours)){if(!h)continue;const start=periodFor(date);if(!chunks.has(start))chunks.set(start,{});chunks.get(start)[date]=h}
   if(!chunks.size)chunks.set(periodFor(old.start),{});
   const refs=[];for(const [start,entries] of chunks){const sheet=getSheet(start),copy={...row,id:uid(),status:old.status,hours:entries};sheet.rows.push(copy);refs.push({sheetId:sheet.id,rowId:copy.id})}
   sources.set(old.id+'|'+row.id,refs);
  }
 }
 result.sheets=[...grouped.values()].map(refreshSheet);
 result.invoices.forEach(i=>i.lines.forEach(l=>{l.sources=sources.get(l.sheetId+'|'+l.rowId);l.end=addDays(l.start,13);delete l.sheetId;delete l.rowId}));
 result.version=2;result.settings.schedule='semimonthly';delete result.settings.anchor;
 if(!validBackup(result))throw Error('Invalid migrated workspace');
 return result;
}

function timesheets(){

{fmtDate(d)}</small></th>`).join('')}<th>Shown</th></tr></thead><tbody>${s.rows.map(r=>{const c=contract(r.contractId),rowEditable=editable&&r.status==='draft';return `<tr><td><strong>${esc(c.client)}</strong><span class="sub">${esc(c.name)}</span><button class="link small" style="font-size:10px;padding:3px 0" onclick="rowNote('${r.id}')">${r.note||!rowEditable?'View note':'Add note'}</button>${rowEditable?` <button class="link small danger" style="font-size:10px" onclick="removeRow('${r.id}')" aria-label="Remove ${esc(c.name)} row">Remove</button>`:''}${r.status!=='draft'?`<span class="sub">${billed(s,r)?'Included on an invoice':r.status==='approved'?'Approved · locked':'Submitted · locked'}</span>`:''}</td>${days.map(d=>`<td class="${[0,6].includes(dateObj(d).getDay())?'weekend':''}"><input type="number" min="0" max="24" step="0.25" inputmode="decimal" value="${r.hours[d]||''}" placeholder="—" aria-label="${esc(c.name)} ${d} hours" ${rowEditable?'':'disabled'} onchange="changeHours('${r.id}','${d}',this)"></td>`).join('')}<td class="num"><strong id="row-total-${r.id}">${hours(sum(days.map(d=>r.hours[d]||0)))}</strong></td></tr>`}).join('')}</tbody><tfoot><tr><td>Total hours</td>${days.map(d=>`<td class="num" id="day-total-${d}">${hours(sum(s.rows.map(r=>r.hours[d]||0)))}</td>`).join('')}<td id="week-total">${hours(wh)}</td></tr></tfoot></table></div>`:empty('A fresh timesheet period','Add a contract to start recording your hours.')}<div class="timesheet-footer"><div>${editable?`<button class="link" onclick="addRowDialog()">${icon('plus')}${s?.status==='approved'?'Add more hours':'Add contract'}</button>`:'<small>Submitted hours are locked for review.</small>'}</div><div class="row wrap">${sheetActions(s)}</div></div></section><p class="muted" style="font-size:11px;margin-top:14px">Enter hours in 15-minute increments. A person’s daily total cannot exceed 24 hours. Approved and invoiced rows stay locked; add a new row for additional hours.</p>`;

function changeHours(rid,d,input){const s=currentSheet(),r=s.rows.find(r=>r.id===rid),n=Number(input.value);if(r.status!=='draft'||!employee(employeeId).active)return;if(d<period||d>periodEnd(period)){toast('Choose a date within this timesheet period.');return}if(!Number.isFinite(n)||n<0||n>24||Math.abs(n*4-Math.round(n*4))>.00001||sum(s.rows.filter(x=>x!==r).map(x=>x.hours[d]||0))+n>24){input.value=r.hours[d]||'';toast('Use quarter hours from 0 to 24. Daily totals cannot exceed 24.');return}r.hours[d]=n;save();updateTimesheetTotals()}
function updateTimesheetTotals(){const s=currentSheet(),days=pageDays(period,week),wh=sum(s.rows.map(r=>sum(days.map(d=>r.hours[d]||0)))),values=document.querySelectorAll('.stat .value');values[0].innerHTML=hours(sheetHours(s))+'<span>hrs</span>';values[1].innerHTML=hours(wh)+'<span>hrs</span>';if(values[2])values[2].textContent=money(sum(s.rows.map(r=>Math.round(rowHours(r)*(r.status==='draft'?contract(r.contractId).rate:r.rate)))));s.rows.forEach(r=>document.getElementById('row-total-'+r.id).textContent=hours(sum(days.map(d=>r.hours[d]||0))));days.forEach(d=>document.getElementById('day-total-'+d).textContent=hours(sum(s.rows.map(r=>r.hours[d]||0))));document.getElementById('week-total').textContent=hours(wh);const submit=document.getElementById('submit-timesheet');if(submit)submit.disabled=!s.rows.some(r=>r.status==='draft'&&rowHours(r)>0)}
function sheetActions(s){
 let actions='';
 if(s?.rows.some(r=>r.status==='submitted'))actions+=`<button onclick="setSheetStatus('draft')">${isOwner()?'Return for changes':'Withdraw'}</button>${isOwner()?`<button class="primary" onclick="setSheetStatus('approved')">${icon('check')}Approve submitted hours</button>`:''}`;
 if(!s||s.status==='draft')actions+=`<button id="submit-timesheet" class="primary" onclick="setSheetStatus('submitted')" ${s?.rows.some(r=>r.status==='draft'&&rowHours(r)>0)?'':'disabled'}>Submit timesheet ${icon('arrow')}</button>`;
 if(s?.status==='approved'&&isOwner()&&!s.rows.some(r=>billed(s,r)))actions+=`<button onclick="setSheetStatus('draft')">Reopen timesheet</button>`;
 return actions;

function setSheetStatus(status){
 const s=currentSheet();if(!s)return;
 if(status==='approved'){if(!isOwner()||!s.rows.some(r=>r.status==='submitted'))return;s.rows.filter(r=>r.status==='submitted').forEach(r=>r.status='approved')}
 else if(status==='submitted'){if(!s.rows.some(r=>r.status==='draft'&&rowHours(r)>0))return;s.rows.filter(r=>r.status==='draft').forEach(r=>{r.rate=contract(r.contractId).rate;r.status='submitted'})}
 else if(status==='draft'){if(s.rows.some(r=>r.status==='submitted'))s.rows.filter(r=>r.status==='submitted').forEach(r=>r.status='draft');else{if(!isOwner()||s.rows.some(r=>billed(s,r)))return;s.rows.forEach(r=>r.status='draft')}}
 else return;
 refreshSheet(s);save();render();toast(status==='submitted'?'Timesheet submitted for review':status==='approved'?'Submitted hours approved. They can now be invoiced.':'Timesheet reopened for editing');
}

function rowNote(rid){const s=currentSheet(),r=s.rows.find(r=>r.id===rid),editable=r.status==='draft';showModal('Work notes',`<label>What did you work on?<textarea id="row-note" maxlength="1000" ${editable?'':'readonly'}>${esc(r.note)}</textarea></label>`,editable?`<button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveNote('${rid}')">Save note</button>`:`<button onclick="closeModal()">Close</button>`)}

function contractsView(){return head('Good work starts here.','Manage client contracts, billing rates, and assigned people.',`<button class="primary" onclick="contractDialog()">${icon('plus')}New contract</button>`)+`<div class="contract-grid">${state.contracts.map(c=>{const used=sum(state.sheets.flatMap(s=>s.rows.filter(r=>r.contractId===c.id).map(rowHours))),assigned=state.employees.filter(e=>e.active&&e.contracts.includes(c.id));return `<section class="panel contract-card"><div class="row between"><div class="monogram">${esc(c.client.slice(0,1))}</div>${badge(c.active?'active':'paused')}</div><small class="eyebrow">${esc(c.client)}</small><h3 style="margin-top:8px">${esc(c.name)}</h3><small>${esc(c.email||'No billing email added')}</small><div class="metrics"><div><small>Hourly billing rate</small><strong>${money(c.rate)}<small style="display:inline"> / hr</small></strong></div><div><small>Total hours recorded</small><strong>${hours(used)}${c.budget?` <small style="display:inline">/ ${hours(c.budget)} budget</small>`:''}</strong></div></div>${c.budget?`<div style="height:4px;background:#eff2e9;border-radius:5px;margin-bottom:19px"><div style="width:${Math.min(100,used/c.budget*100)}%;height:100%;background:${used>c.budget?'#b67848':'#8aadd3'};border-radius:5px"></div></div>`:''}<div class="row between"><small>${assigned.length} ${assigned.length===1?'person':'people'} assigned</small><button class="small" onclick="contractDialog('${c.id}')">Manage ${icon('right')}</button></div></section>`}).join('')}</div>`+(state.contracts.length?'':`<section class="panel">${empty('Your first contract starts here','Add a client, an hourly rate, and the people doing the work.',`<button class="primary" onclick="contractDialog()">New contract</button>`)}</section>`)}
function contractDialog(id){if(!isOwner())return;const c=id?contract(id):{name:'',client:'',email:'',address:'',rate:10000,budget:'',active:true};showModal(id?'Manage contract':'New contract',`<form id="contract-form" onsubmit="event.preventDefault();saveContract(this,'${id||''}')"><div id="form-error"></div><div class="form-grid"><label class="full">Contract name<input name="name" required maxlength="100" value="${esc(c.name)}" placeholder="e.g. Operations consulting"></label><label>Client / company<input name="client" required maxlength="100" value="${esc(c.client)}"></label><label>Billing email<input name="email" type="email" maxlength="150" value="${esc(c.email)}"></label><label>Hourly billing rate (USD)<input name="rate" type="number" min="0.01" max="100000" step="0.01" required value="${c.rate/100}"></label><label>Hours budget (optional)<input name="budget" type="number" min="0" max="1000000" step="0.25" value="${c.budget||''}"></label><label class="full">Billing address<textarea name="address" maxlength="500">${esc(c.address)}</textarea></label><div class="full stack" style="gap:8px"><label>Assigned people</label>${state.employees.filter(e=>e.active).map(e=>`<label class="check"><input name="people" type="checkbox" value="${e.id}" ${id?e.contracts.includes(id)?'checked':'':'checked'}>${esc(e.name)}</label>`).join('')}</div><label class="check full"><input name="active" type="checkbox" ${c.active?'checked':''}>Active — available for new time entries</label><p class="field-help full">Rates are locked when a timesheet is submitted. Existing invoices keep their original details.</p></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" type="submit" form="contract-form">Save contract</button>`)}
function saveContract(form,id){const f=new FormData(form);if(!f.get('name').trim()||!f.get('client').trim())return formError('Add a contract name and client.');const c={id:id||uid(),name:f.get('name').trim(),client:f.get('client').trim(),email:f.get('email').trim(),address:f.get('address').trim(),rate:Math.round(Number(f.get('rate'))*100),budget:Number(f.get('budget'))||0,active:f.has('active')};if(id)state.contracts[state.contracts.findIndex(x=>x.id===id)]=c;else state.contracts.push(c);const people=f.getAll('people');state.employees.forEach(e=>{if(!e.active)return;e.contracts=e.contracts.filter(x=>x!==c.id);if(people.includes(e.id))e.contracts.push(c.id)});save();closeModal();render();toast('Contract saved')}
function teamView(){return head('A team, in sync.','Assign contracts and keep everyone’s hours together.',`<button class="primary" onclick="employeeDialog()">${icon('plus')}Add employee</button>`)+`<section class="panel"><div class="panelhead"><h2>Your people</h2><span class="badge">${state.employees.filter(e=>e.active).length} active</span></div><div class="table-wrap"><table><thead><tr><th>Person</th><th>Assigned contracts</th><th>Hours this period</th><th>Status</th><th></th></tr></thead><tbody>${state.employees.map(e=>{const s=state.sheets.find(s=>s.employeeId===e.id&&s.start===periodFor(today()));return `<tr><td><div class="row"><span class="avatar">${esc(initials(e.name))}</span><div><strong>${esc(e.name)}</strong><span class="sub">${esc(e.email||'No email added')}</span></div></div></td><td>${e.contracts.map(c=>esc(contract(c)?.client||'')).join(', ')||'<span class="muted">No assignments</span>'}</td><td class="num">${s?hours(sheetHours(s)):0} hrs</td><td>${badge(e.active?'active':'inactive')}</td><td class="right"><button class="small" onclick="employeeDialog('${e.id}')">Edit</button></td></tr>`}).join('')}</tbody></table></div></section><div class="note" style="margin-top:20px">Create an invitation below to link an employee record to a sign-in account.</div>`}
function employeeDialog(id){if(!isOwner())return;const e=id?employee(id):{name:'',email:'',active:true,contracts:[]};showModal(id?'Edit employee':'Add employee',`<form id="employee-form" onsubmit="event.preventDefault();saveEmployee(this,'${id||''}')"><div id="form-error"></div><div class="form-grid"><label>Full name<input name="name" required maxlength="100" value="${esc(e.name)}"></label><label>Email (optional)<input type="email" name="email" maxlength="150" value="${esc(e.email)}"></label><div class="full stack" style="gap:8px"><label>Assigned contracts</label>${state.contracts.filter(c=>c.active||e.contracts.includes(c.id)).map(c=>`<label class="check"><input type="checkbox" name="contracts" value="${c.id}" ${e.contracts.includes(c.id)?'checked':''}>${esc(c.client)} · ${esc(c.name)}</label>`).join('')||'<small>Create a contract to assign work.</small>'}</div>${id!==state.employees[0].id?`<label class="check full"><input type="checkbox" name="active" ${e.active?'checked':''}>Active team member</label>`:'<input type="hidden" name="active" value="on">'}<p class="field-help full">This adds an employee record. Invite them to sign in using Workspace access below.</p></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" type="submit" form="employee-form">Save employee</button>`)}
function saveEmployee(form,id){const f=new FormData(form),email=f.get('email').trim();if(!f.get('name').trim())return formError('Enter a name.');if(email&&state.employees.some(e=>e.id!==id&&e.email.toLowerCase()===email.toLowerCase()))return formError('An employee already uses that email.');const e={id:id||uid(),name:f.get('name').trim(),email,active:f.has('active'),contracts:f.getAll('contracts')};if(id)state.employees[state.employees.findIndex(x=>x.id===id)]=e;else state.employees.push(e);save();closeModal();render();toast('Employee saved')}
function invoiceTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Invoice / client</th><th>Due date</th><th>Total</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>${list.map(i=>`<tr><td><strong>${esc(i.number)}</strong><span class="sub">${esc(i.client)}</span></td><td>${fmtDate(i.due,true)}${invoiceStatus(i)==='paid'?`<span class="sub">Paid ${fmtDate([...i.payments].sort((a,b)=>b.date.localeCompare(a.date))[0].date)}</span>`:''}</td><td class="num">${money(total(i))}</td><td class="num">${money(balance(i))}</td><td>${badge(invoiceStatus(i))}</td><td class="right"><button class="small" onclick="invoiceDetail('${i.id}')">View ${icon('right')}</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nothing here yet','Invoices will appear here as you create them.')}
function invoicesView(){const list=state.invoices.filter(i=>(invoiceFilter==='all'||invoiceStatus(i)===invoiceFilter)&&`${i.number} ${i.client}`.toLowerCase().includes(search.toLowerCase())),sent=state.invoices.filter(i=>i.sentDate);return head('From hours to paid.','Create invoices from approved hours and track every payment.',`<button class="primary" onclick="newInvoiceDialog()">${icon('plus')}Create invoice</button>`)+`<div class="stats" style="grid-template-columns:repeat(3,1fr)">${stat('Ready to invoice',money(sum(readyLines().map(l=>l.amount))),'Approved, unbilled time','clock')}${stat('Outstanding balance',money(sum(sent.map(balance))),'Across sent invoices','invoice')}${stat('Total collected',money(sum(state.invoices.map(paid))),'All recorded payments','money',true)}</div><div class="toolbar"><div class="tabs">${['all','draft','sent','partial','overdue','paid'].map(t=>`<button class="${t===invoiceFilter?'selected':''}" onclick="invoiceFilter='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><input class="search" type="search" aria-label="Search invoices" placeholder="Search invoices or clients…" value="${esc(search)}" oninput="search=this.value;document.getElementById('invoice-results').innerHTML=invoiceTable(state.invoices.filter(i=>(invoiceFilter==='all'||invoiceStatus(i)===invoiceFilter)&&((i.number+' '+i.client).toLowerCase().includes(search.toLowerCase()))).slice().reverse())"></div><section class="panel" id="invoice-results">${invoiceTable(list.slice().reverse())}</section><p class="muted" style="font-size:11px;margin-top:14px">“Mark sent” records when you send an invoice yourself. Payments are recorded manually. This preview does not send email or process payments.</p>`}
function newInvoiceDialog(){if(!isOwner())return;const eligible=state.contracts.filter(c=>readyLines(c.id).length);if(!eligible.length){toast('Approve a timesheet with unbilled hours first.');return}showModal('Create an invoice',`<form id="invoice-form" onsubmit="event.preventDefault();createInvoice(this)"><div id="form-error"></div><div class="form-grid"><label class="full">Contract<select name="contract" onchange="invoicePreview(this.value)">${eligible.map(c=>`<option value="${c.id}">${esc(c.client)} · ${esc(c.name)}</option>`).join('')}</select></label><div id="invoice-preview" class="note full"></div><label>Invoice date<input type="date" name="issued" value="${today()}" required></label><label>Due date<input type="date" name="due" value="${addDays(today(),30)}" required></label><label class="full">Invoice note<textarea name="note" maxlength="1000">${esc(state.settings.paymentNote)}</textarea></label><p class="field-help full">Includes all approved, unbilled rows for this contract. Each row can appear on only one invoice. No tax is added.</p></div></form>`,`<button onclick="closeModal()">Cancel</button><button class="primary" type="submit" form="invoice-form">Create draft</button>`);invoicePreview(eligible[0].id)}
function invoicePreview(cid){const lines=readyLines(cid);document.getElementById('invoice-preview').innerHTML=`<strong>${hours(sum(lines.map(l=>rowHours(l.r))))} hours · ${money(sum(lines.map(l=>l.amount)))}</strong><br>${lines.length} time ${lines.length===1?'entry':'entries'} across ${new Set(lines.map(l=>l.s.start)).size} semi-monthly period(s).`}
function createInvoice(form){const f=new FormData(form),c=contract(f.get('contract')),available=readyLines(c.id);if(f.get('due')<f.get('issued'))return formError('The due date must be on or after the invoice date.');if(!available.length)return formError('These hours have already been invoiced.');if(sum(available.map(l=>l.amount))<1)return formError('The invoice total must be at least $0.01.');const num=Math.max(1000,...state.invoices.map(i=>Number(i.number.replace('INV-',''))||0))+1,i={id:uid(),number:'INV-'+num,contractId:c.id,client:c.client,contract:c.name,email:c.email,address:c.address,business:{...state.settings},issued:f.get('issued'),due:f.get('due'),sentDate:null,lines:available.map(({s,r,amount})=>({sources:[{sheetId:s.id,rowId:r.id}],description:r.note||c.name,employee:employee(s.employeeId).name,start:s.start,end:periodEnd(s.start),hours:rowHours(r),rate:r.rate,amount})),payments:[],note:f.get('note').trim()};state.invoices.push(i);save();closeModal();view='invoices';invoiceFilter='all';render();invoiceDetail(i.id);toast('Draft created. Review it, then record when you send it.')}
function invoicePaper(i){return `<div class="invoice-paper"><div class="row between invoice-top"><div><span class="eyebrow" style="color:var(--accent)">INVOICE</span><h1 style="margin:8px 0">${esc(i.number)}</h1>${badge(invoiceStatus(i))}</div><div class="right invoice-business"><img class="invoice-logo" src="${BRAND_LOGO}" alt="Company logo" width="88" height="88"><h3>${esc(i.business.business)}</h3><small>${esc(i.business.email)}</small><div class="preline muted" style="font-size:11px">${esc(i.business.address)}</div></div></div><div class="row between billto"><div><small class="eyebrow">Bill to</small><h3 style="margin:6px 0">${esc(i.client)}</h3><small>${esc(i.email)}</small><div class="preline muted" style="font-size:11px">${esc(i.address)}</div></div><div class="right"><small>Issued ${fmtDate(i.issued,true)}<br>Due ${fmtDate(i.due,true)}${i.sentDate?`<br>Sent ${fmtDate(i.sentDate,true)}`:''}</small></div></div><div class="table-wrap"><table><thead><tr><th>Services</th><th class="right">Hours</th><th class="right">Rate</th><th class="right">Amount</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td><strong>${esc(l.employee)}</strong><span class="sub preline">${esc(l.description)}</span><span class="sub">${range(l.start,l.end)}</span></td><td class="right num">${hours(l.hours)}</td><td class="right num">${money(l.rate)}</td><td class="right num">${money(l.amount)}</td></tr>`).join('')}</tbody></table></div><div class="invoice-totals"><div class="row"><span>Invoice total</span><strong>${money(total(i))}</strong></div><div class="row muted"><span>Payments received</span><span>−${money(paid(i))}</span></div><div class="row total"><strong>Balance due</strong><strong>${money(balance(i))}</strong></div></div>${i.note?`<p class="muted preline" style="font-size:12px">${esc(i.note)}</p>`:''}${i.payments.length?`<div class="payment-history"><h3 style="font-size:12px;margin-bottom:9px">Payment history</h3>${i.payments.map(p=>`<div class="row between" style="font-size:11px;margin-top:7px"><span>${fmtDate(p.date,true)} · ${esc(p.reference||'Payment')}</span><strong>${money(p.amount)}</strong></div>`).join('')}</div>`:''}</div>`}
function invoiceDetail(id){const i=state.invoices.find(i=>i.id===id);showModal(i.number,invoicePaper(i),`${!i.sentDate?`<button class="danger" onclick="deleteInvoice('${id}')">Delete draft</button>`:''}<button onclick="printInvoice('${id}')">Print / PDF</button>${!i.sentDate?`<button class="primary" onclick="sendDialog('${id}')">Mark sent ${icon('arrow')}</button>`:balance(i)>0?`<button class="primary" onclick="paymentDialog('${id}')">Record payment</button>`:''}`,true)}
function printInvoice(id){document.getElementById('print-area').innerHTML=invoicePaper(state.invoices.find(i=>i.id===id));window.print()}
function deleteInvoice(id){confirmModal('Delete this draft invoice?','Its hours will become available to invoice again.',()=>{const i=state.invoices.find(i=>i.id===id);if(i.sentDate)return;state.invoices=state.invoices.filter(i=>i.id!==id);save();render();toast('Draft deleted; hours are available to invoice.')})}
function sendDialog(id){const i=state.invoices.find(i=>i.id===id);showModal('Record invoice sent',`<form id="send-form" onsubmit="event.preventDefault();markSent('${id}',this)"><div id="form-error"></div><p class="muted" style="font-size:12px;margin-bottom:18px">Record when you sent ${esc(i.number)} to ${esc(i.client)}. This does not send an email.</p><label>Date sent<input name="date" type="date" min="${i.issued}" max="${today()}" required value="${today()}"></label></form>`,`<button onclick="invoiceDetail('${id}')">Back</button><button class="primary" type="submit" form="send-form">Mark sent</button>`)}
function markSent(id,form){const i=state.invoices.find(i=>i.id===id),d=new FormData(form).get('date');if(d<i.issued||d>today())return formError('Use a date between the invoice date and today.');i.sentDate=d;save();render();invoiceDetail(id);toast('Invoice marked as sent')}
function paymentDialog(id){const i=state.invoices.find(i=>i.id===id);showModal('Record a payment',`<form id="payment-form" onsubmit="event.preventDefault();recordPayment('${id}',this)"><div id="form-error"></div><div class="note" style="margin-bottom:20px">${esc(i.number)} · ${esc(i.client)}<br><strong>Remaining balance: ${money(balance(i))}</strong></div><div class="form-grid"><label>Amount received (USD)<input name="amount" type="number" min="0.01" max="${balance(i)/100}" step="0.01" required value="${balance(i)/100}"></label><label>Payment date<input name="date" type="date" min="${i.issued}" max="${today()}" value="${today()}" required></label><label class="full">Reference / method (optional)<input name="reference" maxlength="150" placeholder="e.g. Bank transfer, check #1042"></label><p class="field-help full">Partial payments are welcome. The invoice is marked paid when its balance reaches zero.</p></div></form>`,`<button onclick="invoiceDetail('${id}')">Back</button><button class="primary" type="submit" form="payment-form">Save payment</button>`)}
function recordPayment(id,form){const i=state.invoices.find(i=>i.id===id),f=new FormData(form),amount=Math.round(Number(f.get('amount'))*100),date=f.get('date');if(!i.sentDate||!Number.isFinite(amount)||amount<=0||amount>balance(i))return formError('Enter a positive amount no greater than the remaining balance.');if(date<i.issued||date>today())return formError('Use a payment date between the invoice date and today.');i.payments.push({id:uid(),amount,date,reference:f.get('reference').trim()});save();render();invoiceDetail(id);toast(balance(i)===0?'Paid in full. Nicely done.':'Partial payment recorded')}
function settingsView(){return head('Make yourself at home.','Business details, semi-monthly timesheets, and your data.')+`<div class="settings-grid"><section class="panel"><div class="panelhead"><div><h2>Business details</h2><small>Shown on new invoices</small></div></div><form class="panelbody" onsubmit="event.preventDefault();saveSettings(this)"><div class="form-grid"><label class="full">Business name<input name="business" maxlength="100" required value="${esc(state.settings.business)}"></label><label class="full">Billing email<input name="email" type="email" maxlength="150" value="${esc(state.settings.email)}"></label><label class="full">Business address<textarea name="address" maxlength="500">${esc(state.settings.address)}</textarea></label><label class="full">Default invoice note / payment instructions<textarea name="paymentNote" maxlength="1000">${esc(state.settings.paymentNote)}</textarea></label><div class="note full"><strong>Fixed semi-monthly timesheet schedule</strong><br>Period 1: 1st–15th<br>Period 2: 16th–last day of the month<br><span class="field-help">Month endings and leap years are handled automatically. This schedule applies to everyone.</span></div><small class="full">Currency: USD · Invoice totals exclude tax.</small><div class="full"><button class="primary" type="submit">Save settings</button></div></div></form></section><div class="stack" style="align-content:start"><section class="panel"><div class="panelhead"><h2>Your data, close at hand.</h2></div><div class="panelbody stack"><p class="muted" style="font-size:12px">Your workspace is saved to the server. Export a JSON backup for an additional copy. A backup contains employee and invoice information.</p><button onclick="exportBackup()">${icon('download')}Export workspace backup</button><button onclick="document.getElementById('import-file').click()">Restore from backup</button><input id="import-file" type="file" accept="application/json,.json" hidden onchange="importBackup(this.files[0]);this.value='' "><small>${saveLabel()}</small></div></section><section class="panel"><div class="panelhead"><h2>A clean start</h2></div><div class="panelbody stack"><p class="muted" style="font-size:12px">Ready to use your own contracts? Clear this account’s workspace and start with just your owner profile.</p><button class="danger" onclick="resetDialog()">Start an empty workspace</button><button onclick="loadSample()">Reload sample workspace</button></div></section></div></div>`}
function saveSettings(form){const f=new FormData(form);if(!f.get('business').trim()){toast('Enter a business name.');return}state.settings={...state.settings,business:f.get('business').trim(),email:f.get('email').trim(),address:f.get('address').trim(),paymentNote:f.get('paymentNote').trim(),schedule:'semimonthly'};period=periodFor(today());save();render();toast('Business settings saved')}
function download(name,content,type){try{const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){toast('Downloads are unavailable in this preview.')}}
function exportBackup(){download('interval-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json')}
function exportTimesheets(){const cell=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"',rows=[['Employee','Period start','Period end','Date','Client','Contract','Hours','Status','Work note']];state.sheets.filter(s=>s.start===period).forEach(s=>s.rows.forEach(r=>Object.entries(r.hours).sort().filter(([,h])=>h>0).forEach(([d,h])=>rows.push([employee(s.employeeId).name,s.start,periodEnd(s.start),d,contract(r.contractId).client,contract(r.contractId).name,h,r.status,r.note]))));download('interval-timesheets-'+period+'.csv',rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function validBackup(x){
 const str=v=>typeof v==='string',id=v=>str(v)&&/^[a-zA-Z0-9_-]{1,100}$/.test(v),date=v=>str(v)&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&iso(dateObj(v))===v,num=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0,int=v=>num(v)&&Number.isSafeInteger(v),uniq=a=>new Set(a.map(v=>v.id)).size===a.length;
 try{if(![1,2].includes(x.version)||typeof x.demo!=='boolean'||![x.employees,x.contracts,x.sheets,x.invoices].every(Array.isArray)||!x.employees.length||(x.version===1?!date(x.settings.anchor):x.settings.schedule!=='semimonthly')||!['business','email','address','paymentNote'].every(k=>str(x.settings[k])))return false;
 if(![x.employees,x.contracts,x.sheets,x.invoices].every(uniq))return false;
 if(!x.contracts.every(c=>id(c.id)&&['name','client','email','address'].every(k=>str(c[k]))&&int(c.rate)&&c.rate>0&&num(c.budget)&&typeof c.active==='boolean'))return false;
 const cs=new Set(x.contracts.map(c=>c.id)),es=new Set(x.employees.map(e=>e.id));
 if(!x.employees[0].active||!x.employees.every(e=>id(e.id)&&str(e.name)&&e.name.trim()&&str(e.email)&&typeof e.active==='boolean'&&Array.isArray(e.contracts)&&e.contracts.every(c=>cs.has(c))))return false;
 const keys=new Set();for(const s of x.sheets){const key=s.employeeId+'|'+s.start;if(keys.has(key))return false;keys.add(key);if(!id(s.id)||!es.has(s.employeeId)||!date(s.start)||(x.version===1?dayDiff(s.start,x.settings.anchor)%14!==0:s.start!==periodFor(s.start))||!['draft','submitted','approved'].includes(s.status)||!Array.isArray(s.rows)||!uniq(s.rows))return false;const days={};for(const r of s.rows){if(!id(r.id)||(x.version===2&&!['draft','submitted','approved'].includes(r.status))||!cs.has(r.contractId)||!int(r.rate)||!str(r.note)||!r.hours||typeof r.hours!=='object'||Array.isArray(r.hours))return false;for(const [d,h]of Object.entries(r.hours)){if(!date(d)||d<s.start||d>(x.version===1?addDays(s.start,13):periodEnd(s.start))||!num(h)||h>24||h*4%1!==0)return false;days[d]=(days[d]||0)+h;if(days[d]>24)return false}}if(x.version===2&&s.status!==refreshSheet({...s}).status)return false}
 const used=new Set(),numbers=new Set();for(const i of x.invoices){if(!id(i.id)||!/^INV-\d+$/.test(i.number)||numbers.has(i.number)||!cs.has(i.contractId)||!['client','contract','email','address','note'].every(k=>str(i[k]))||!date(i.issued)||!date(i.due)||i.due<i.issued||(i.sentDate!==null&&(!date(i.sentDate)||i.sentDate<i.issued||i.sentDate>today()))||!['business','email','address'].every(k=>str(i.business[k]))||!Array.isArray(i.lines)||!i.lines.length||!Array.isArray(i.payments)||!uniq(i.payments))return false;numbers.add(i.number);for(const l of i.lines){
 const refs=x.version===1?[{sheetId:l.sheetId,rowId:l.rowId}]:l.sources,end=x.version===1?addDays(l.start,13):l.end;
 if(!Array.isArray(refs)||!refs.length||!str(l.description)||!str(l.employee)||!date(l.start)||!date(end)||end<l.start||!num(l.hours)||l.hours<=0||!int(l.rate)||!int(l.amount))return false;
 let sourceHours=0;for(const ref of refs){const s=x.sheets.find(s=>s.id===ref.sheetId),r=s?.rows.find(r=>r.id===ref.rowId),key=ref.sheetId+'|'+ref.rowId;if(!s||!r||(x.version===1?s.status:r.status)!=='approved'||r.contractId!==i.contractId||used.has(key)||l.rate!==r.rate||(x.version===1&&l.start!==s.start)||Object.keys(r.hours).some(d=>d<l.start||d>end))return false;sourceHours+=rowHours(r);used.add(key)}
 if(l.hours!==sourceHours||l.amount!==Math.round(l.hours*l.rate))return false;
 }if(!i.payments.every(p=>id(p.id)&&int(p.amount)&&p.amount>0&&date(p.date)&&p.date>=i.issued&&p.date<=today()&&str(p.reference))||sum(i.lines.map(l=>l.amount))<1||sum(i.payments.map(p=>p.amount))>sum(i.lines.map(l=>l.amount))||(!i.sentDate&&i.payments.length))return false}return true;
 }catch(e){return false}
}
async function importBackup(file){if(!file)return;if(file.size>5000000){toast('Choose an Interval JSON backup smaller than 5 MB.');return}try{const x=upgradeWorkspace(JSON.parse(await file.text()));confirmModal('Replace this workspace?','The selected backup will replace all current workspace records. Export your current workspace first if you need to keep it.',()=>{state=x;role=accountRole;employeeId=linkedEmployeeId;period=periodFor(today());loadError=false;save();render();toast('Workspace restored')})}catch(e){toast('This is not a valid Interval workspace backup. Nothing changed.')}}
function resetDialog(){confirmModal('Start an empty workspace?','Workspace hours, invoices, and contracts will be removed. Employee records linked to accounts will be kept. Export a backup first to keep them.',()=>{state=retainAccounts({version:2,demo:false,settings:{business:'Your business',email:'',address:'',paymentNote:'Thank you for your business.',schedule:'semimonthly'},employees:[{id:uid(),name:'You',email:'',active:true,contracts:[]}],contracts:[],sheets:[],invoices:[]});employeeId=linkedEmployeeId;period=periodFor(today());loadError=false;save();view='settings';render();toast('Fresh workspace ready. Timesheets follow the 1st–15th and 16th–month end.')})}
function loadSample(){confirmModal('Reload the sample workspace?','This replaces your current workspace data. Export a backup first if you want to keep it.',()=>{state=retainAccounts(seed());role=accountRole;employeeId=linkedEmployeeId;period=periodFor(today());loadError=false;save();view='overview';render()})}
function showModal(title,body,footer,wide=false){modalFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal ${wide?'wide':''}"><div class="modalhead"><h2 id="modal-title">${esc(title)}</h2><button aria-label="Close dialog" onclick="closeModal()">${icon('close')}</button></div><div class="modalbody">${body}</div><div class="modalfoot">${footer}</div></section></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input:not([type=hidden]),.modal select,.modal textarea,.modal button')?.focus(),20)}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';modalFocus?.focus?.()}
let confirmAction=null;
function confirmModal(title,message,action){confirmAction=action;showModal(title,`<p class="muted">${esc(message)}</p>`,`<button onclick="closeModal()">Cancel</button><button class="primary" onclick="const action=confirmAction;confirmAction=null;closeModal();action()">Confirm</button>`)}
function formError(message){document.getElementById('form-error').innerHTML=`<div class="error" role="alert">${esc(message)}</div>`}
document.addEventListener('keydown',e=>{const modal=document.querySelector('.modal');if(!modal)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...modal.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled&&x.type!=='hidden'),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
bootstrap();
</script></body></html>
